<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>

    <form class="bg-light p-4 border rounded mt-4">

            <div class="mb-3">
                <label class="form-label">Name</label>
                <input class="form-control" type="text" id="productName" placeholder="Apple">
            </div>

            <div class="mb-3">
                <label class="form-label">Price</label>
                <input class="form-control" type="number" id="producePrice" placeholder="12">
            </div>

            <div class="mb-3">
                <label class="form-label">Category</label>
                <select class="form-select" id="">

                    <option value="">Select a category</option>
                    <option value="fruits">Fuits</option>
                    <option value="electronics">Electronics</option>
                </select>

            </div>

            <div class="d-flex justify-content-end gap-3">
                <button class="btn btn-primary" type="submit">Register</button>
                <button class="btn btn-secondary" type="reset">Reset</button>
            </div>

        </form>












    
</body>
</html>
