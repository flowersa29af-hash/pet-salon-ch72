<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Services</title>  
</head>
<body>
<nav class="navbar navbar-expand-lg bg-body-tertiary">
  <div class="container-fluid">
     <a class="navbar-brand" href="index.html">Pet Salon</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
          <span class="navbar-toggler-icon"></span>
        </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav">
        <li class="nav-item">
          <a class="nav-link"  href="#">Home</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Registration.html">Registration</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="Services.html">Services</a>
        </li>
      </ul>
    </div>
  </div>
</nav>
    <main class="container py-5">
      <div class="row justify-content-center">
        <div class="col-12 col-md-8 col-lg-6">
          <h1 class="text-center mb-4">Pet Salon Services</h1>

          <form id="serviceForm" class="card shadow-sm border-0 p-4">
            <div class="mb-3">
              <label for="serviceName" class="form-label">Service</label>
              <input id="serviceName" class="form-control" type="text"
                     placeholder="Example: Bath and brush" required>
            </div>

            <div class="mb-3">
              <label for="serviceDesc" class="form-label">Description</label>
              <input id="serviceDesc" class="form-control" type="text"
                     placeholder="Describe the service" required>
            </div>

            <div class="mb-4">
              <label for="servicePrice" class="form-label">Price</label>
              <input id="servicePrice" class="form-control" type="number"
                     placeholder="Example: 25" min="0.01" step="0.01" required>
            </div>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-end">
              <button id="registerService" class="btn btn-primary" type="submit">
                Register
              </button>
              <button class="btn btn-outline-secondary" type="reset">
                Reset
              </button>
            </div>
          </form>
        </div>
      </div>
    </main>
 <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
 <script src="https://code.jquery.com/jquery-4.0.0.js" integrity="sha256-9fsHeVnKBvqh3FB2HYu7g2xseAZ5MlN6Kz/qnkASV8U=" crossorigin="anonymous"></script>

 <script src="./scripts/services.js"></script>

</body>
</html>
